name = "fitness-photos"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "fitness-photos"

[vars]
FIREBASE_PROJECT_ID = "fitness-da269"
# AI 教練使用的模型與每人每天問答上限（金鑰用 wrangler secret put ANTHROPIC_API_KEY 設定）
COACH_MODEL = "claude-opus-5-5"
COACH_DAILY_LIMIT = "30"
# 允許呼叫此服務的網站（逗號分隔）
ALLOWED_ORIGINS = "https://melodymatestaiwan.github.io,http://localhost:5173,http://localhost:4173"
